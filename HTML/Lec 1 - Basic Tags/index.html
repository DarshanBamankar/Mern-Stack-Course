<!-- BASIC TAGS -->

<!-- HTML elements are everything between the starting and ending of a tag  -->

<h1>h1</h1>
<!-- highest importance-->

<h2>h2</h2>
<h3>h3</h3>

<br />
<!-- <br/> tag is used to break the line i.e insert space -->

<h4>h4</h4>
<h5>h5</h5>

<h6>h6</h6>
<!-- lowest importance-->

<hr />
<!-- Used to insert a horizontal line -->

<p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Fugiat, commodi?</p>
<!-- Content -->

<!-- LISTS -->

<!-- Unordered list - Create a list without numbering  -->

<ul>
  <li>first</li>
  <li>Second</li>
  <li>Third</li>
  <li>Fourth</li>
  <li>Fifth</li>
</ul>

<!-- Ordered list - Create a list with numbering -->

<ol>
  <li>first</li>
  <li>Second</li>
  <li>Third</li>
  <li>Fourth</li>
  <li>Fifth</li>
</ol>

<!-- Anchor Tag -->

<a href="https://youtu.be/GkZN_-HMCJ8" target="_parent"> Lec 1 - See now </a>

<!-- <a href=" ">  enables us to create hyperlinks and target="_blank" ensures the link is opened in new tab -->

<!-- Image tag -->

<img
  src="https://i.pinimg.com/originals/c0/68/06/c06806d173413a1d51c114ebdba67af9.jpg"
  alt="Lewis Hamilton"
  height="200px"
  width="200px"
/>

<!-- <img src= " " alt = " " >  enables us to insert images into our website 
      alt = " " is used to insert alternate text to your image which is displayed when the image is not loaded/ available due to some reason
-->

<!-- The src, alt, href, height , width etc. are all the attributes the tags have -->
